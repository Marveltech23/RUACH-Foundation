<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — RUACH Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body class="login-page">

<div class="login-card">
  <div class="login-logo">
    <img src="../images/logoAsset 3.png" alt="RUACH Foundation">
    <div>
      <div style="font-family:var(--serif);font-size:1.15rem;font-weight:600;color:var(--emerald)">RUACH Foundation</div>
      <div style="font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)">Admin Portal</div>
    </div>
  </div>

  <h1 class="login-title">Sign In</h1>
  <p class="login-sub">Manage gallery photos, blog articles, upcoming events, registrations, donations, and inquiries.</p>

  <div id="loginAlert" class="login-alert"></div>

  <form id="loginForm" style="display:flex;flex-direction:column;gap:16px">
    <div class="field">
      <label for="adminEmail">Email Address</label>
      <input type="email" id="adminEmail" required placeholder="admin@ruachfoundation.org">
    </div>
    <div class="field">
      <label for="adminPassword">Password</label>
      <input type="password" id="adminPassword" required placeholder="••••••••">
    </div>
    <button type="submit" id="loginBtn" class="btn btn-gold" style="width:100%;padding:14px">Sign In to Admin →</button>
  </form>

  <div style="margin-top:22px;text-align:center;font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:8px">
    <div>Need an admin account? <a href="signup.html" style="color:var(--emerald);font-weight:600;text-decoration:underline">Create Account</a></div>
    <a href="../index.html" style="color:var(--emerald);text-decoration:underline">← Back to RUACH Website</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script>
const alertBox = document.getElementById('loginAlert');

function showAlert(msg, kind = 'error') {
  alertBox.textContent = msg;
  alertBox.className = 'login-alert ' + kind;
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!window.isSupabaseConfigured()) {
    showAlert('Supabase is not connected yet. Open frontend/js/supabase-config.js and paste your SUPABASE_URL and SUPABASE_ANON_KEY.', 'info');
    return;
  }
  const sb = window.getSupabaseClient();
  const { data: { session } } = await sb.auth.getSession();
  if (session) window.location.href = 'index.html';
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!window.isSupabaseConfigured()) {
    showAlert('Please configure SUPABASE_URL and SUPABASE_ANON_KEY in frontend/js/supabase-config.js first.', 'error');
    return;
  }
  const email = document.getElementById('adminEmail').value.trim();
  const password = document.getElementById('adminPassword').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const sb = window.getSupabaseClient();
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) throw error;
    window.location.href = 'index.html';
  } catch (err) {
    showAlert(err.message || 'Invalid credentials.', 'error');
    btn.disabled = false;
    btn.textContent = 'Sign In to Admin →';
  }
});
</script>
</body>
</html>
